<!DOCTYPE html>
<html>
<head>
    <title>Kuldeep Digital Studio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        header {
            background-color: #222;
            color: white;
            padding: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        nav {
            background-color: #444;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        section {
            background-color: white;
            margin: 25px auto;
            padding: 30px;
            max-width: 700px;
            border-radius: 12px;
        }

        h2 {
            color: darkblue;
        }

        p {
            font-size: 18px;
        }

        .service {
            background-color: #eeeeee;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }

        input,
        textarea {
            width: 80%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            background-color: black;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: gray;
        }

        #result {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Kuldeep Digital Studio</h1>
        <p>Creative Design & Website Services</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h2>Welcome 👋</h2>
        <p>Welcome to my website.</p>
        <button onclick="showWelcome()">Get Started</button>
    </section>

    <section id="about">
        <h2>About Us</h2>
        <p>
            Hum Logo, Banner aur Website Design karte hain.
        </p>
    </section>

    <section id="services">
        <h2>Hamari Services</h2>

        <div class="service">🎨 Logo Design</div>
        <div class="service">🖼️ Banner Design</div>
        <div class="service">💻 Website Design</div>
    </section>

    <section id="contact">
        <h2>Contact Us 📞</h2>

        <form id="contactForm">

            <input
                type="text"
                id="name"
                placeholder="Apna Naam"
                required>

            <br><br>

            <input
                type="tel"
                id="mobile"
                placeholder="Mobile Number"
                required>

            <br><br>

            <textarea
                id="message"
                placeholder="Apna Message"
                required></textarea>

            <br><br>

            <button type="submit">Send Message</button>

        </form>

        <p id="result"></p>
    </section>

    <script>
        function showWelcome() {
            alert("Welcome to Kuldeep Digital Studio!");
        }

        document.getElementById("contactForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;

            document.getElementById("result").innerText =
                "Thank you " + name + "! Your message has been received.";

        });
    </script>

</body>
</html>
